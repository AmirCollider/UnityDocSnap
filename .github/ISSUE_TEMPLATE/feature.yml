name: Feature request
description: Something Unity DocSnap should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your project?
      description: >
        The question you are asking your project, rather than the feature you
        have in mind for answering it. A tool that answers the question a
        different way is still an answer.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Even if the answer is "by hand, badly".
